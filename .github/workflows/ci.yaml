name: Test

on: [push, pull_request]

jobs:
  startup:
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        neovim_version: ['nightly', 'v0.12.0']
        preset: ['full', 'ssh']

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v7
        with:
          node-version: '22'

      - uses: rhysd/action-setup-vim@v1
        with:
          neovim: true
          version: ${{ matrix.neovim_version }}

      - name: Set up Neovim configuration directory
        run: cp -rT . ~/.config/nvim

      - name: Install pinned plugins
        env:
          NVIM_PRESET: ${{ matrix.preset }}
        run: nvim --headless +qa

      - name: Start without errors
        shell: bash
        env:
          NVIM_PRESET: ${{ matrix.preset }}
        run: |
          nvim --version
          nvim --headless \
            +'lua vim.defer_fn(function() vim.cmd(vim.v.errmsg == "" and "qa!" or "cq!") end, 3000)' \
            2>&1 | tee startup.log
          ! grep -qE "^E[0-9]+:|Error" startup.log
